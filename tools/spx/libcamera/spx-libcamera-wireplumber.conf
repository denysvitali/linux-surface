# Opt-in drop-in for the user wireplumber.service: host the camera monitor with the
# Surface Pro X libcamera build (spx-libcamera package) instead of the distro one.
# Install as /etc/systemd/user/wireplumber.service.d/60-spx-libcamera.conf and log in again
# (or reboot). Roll back by removing the file.
# CPU soft ISP is the validated path (see README.md); the GPU path is untested here.
[Service]
Environment=LD_LIBRARY_PATH=/usr/lib/spx-libcamera/lib
Environment=LIBCAMERA_SOFTISP_MODE=cpu
