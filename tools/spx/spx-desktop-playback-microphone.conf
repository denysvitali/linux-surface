# Opt-in drop-in for spx-desktop-playback.service: also publish the fitted
# microphone as the on-demand PipeWire source "spx_microphone" (no recording;
# clients alone open the capture PCM). Best effort: a microphone fault never
# stops the speakers. Remove this file and reboot to roll back.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/lib/spx/audio.py play-desktop --owner spx-desktop --desktop-user dvitali --allow-amp-power --allow-playback --pa-gain-step 1 --pa-gain-file /etc/spx/speaker-gain-step --desktop-peak 32768 --serve-seconds 0 --feeder /usr/local/lib/spx/spx-pcm-feed --period-frames 480 --periods 8 --output /var/lib/spx-desktop-playback --desktop-microphone
