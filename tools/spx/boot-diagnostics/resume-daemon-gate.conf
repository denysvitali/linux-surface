# Optional happy-daemon.service.d drop-in, reviewed for the armed SPX trial.
# Install resume.py first. This template does not enable or arm continuation.
# Unarmed, same-boot and mismatched trials return immediately.
[Service]
# Unexpected helper errors must not prevent unrelated Happy startup either.
ExecStartPre=-/usr/bin/python3 %h/.local/state/spx-port/resume.py --daemon-preflight
TimeoutStartSec=210
