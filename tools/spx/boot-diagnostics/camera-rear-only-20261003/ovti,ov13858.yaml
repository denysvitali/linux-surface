%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov13858.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV13858 image sensor

maintainers:
  - Sakari Ailus <sakari.ailus@linux.intel.com>

description: |
  The OV13858 is an image sensor with a MIPI CSI-2 output and an I2C
  control interface. This local draft describes the four-lane configuration
  and 19.2 MHz reference clock supported by the current Linux driver.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ov13858

  reg:
    maxItems: 1

  clocks:
    description: Reference clock, 19.2 MHz for the current driver.
    maxItems: 1

  dovdd-supply:
    description: Digital I/O supply.

  avdd-supply:
    description: Analog supply.

  dvdd-supply:
    description: Digital core supply.

  reset-gpios:
    description: Active-low sensor reset input.
    maxItems: 1

  power-domains:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false
        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4
          link-frequencies:
            items:
              - const: 540000000
              - const: 270000000
        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - dovdd-supply
  - avdd-supply
  - dvdd-supply
  - port

unevaluatedProperties: false
...
