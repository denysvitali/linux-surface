name: Build Surface Pro X (SC8180X) Kernel

on:
  push:
    branches:
      - 'spx/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/runner/.cache/ccache
  KERNEL_SRC_DIR: /home/runner/kernel-builds/linux-surface-src
  KERNEL_BUILD_DIR: /home/runner/kernel-builds/linux-surface-build
  KERNEL_ARTIFACTS_DIR: /home/runner/kernel-builds/artifacts
  CONDA_ROOT: /home/runner/miniforge

jobs:
  build:
    runs-on: [self-hosted, arm64]
    name: build (${{ matrix.variant.name }})
    strategy:
      matrix:
        variant:
          - name: modular
            # Uses =m for most SPX drivers (development / distro style).
            # Requires initramfs / modules to be installed.
            extra_fragment: ""
          - name: builtin
            # ALL drivers compiled into the kernel image (every =m → =y).
            # Boot by flashing Image.gz + DTB only; no initramfs needed.
            extra_fragment: "builtin"
    steps:
      - name: Setup environment
        run: |
          export HOME=/home/runner
          mkdir -p $KERNEL_SRC_DIR
          mkdir -p ${KERNEL_BUILD_DIR}-${{ matrix.variant.name }}
          mkdir -p $CCACHE_DIR
          echo "Source directory: $KERNEL_SRC_DIR"
          echo "Build directory: ${KERNEL_BUILD_DIR}-${{ matrix.variant.name }}"
          echo "Ccache directory: $CCACHE_DIR"

      - name: Checkout to persistent location
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
          REF="${{ github.ref_name }}"
          SHA="${{ github.sha }}"

          if [ -d "$KERNEL_SRC_DIR/.git" ]; then
            echo "Repository exists, fetching updates..."
            cd "$KERNEL_SRC_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin
            git checkout -f "$SHA"
            git reset --hard "$SHA"
            git clean -fdx --exclude=modules_install
            echo "Checked out commit: $(git log -1 --oneline)"
          else
            echo "Cloning repository (first time)..."
            git clone --depth=1 --branch="$REF" "$REPO_URL" "$KERNEL_SRC_DIR"
            cd "$KERNEL_SRC_DIR"
            git fetch origin "$SHA"
            git checkout -f "$SHA"
            echo "Checked out commit: $(git log -1 --oneline)"
          fi

      - name: Install Miniforge3
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$PATH"
          export CONDA_ROOT=$HOME/miniforge

          if [ -d "$CONDA_ROOT" ]; then
            echo "Miniforge already installed at $CONDA_ROOT"
          else
            echo "=== Installing Miniforge3 ==="
            curl -fsSL https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh -o /tmp/miniforge.sh
            bash /tmp/miniforge.sh -b -p "$CONDA_ROOT"
            rm /tmp/miniforge.sh
          fi

          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          conda activate base
          echo "Conda version: $(conda --version)"

      - name: Install build dependencies
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$CONDA_ROOT/bin:$PATH"
          export CONDA_ROOT=$HOME/miniforge
          source "$CONDA_ROOT/etc/profile.d/conda.sh"
          conda activate base

          echo "=== Installing base packages via Conda ==="
          conda install -y \
            m4 \
            python \
            rsync \
            elfutils \
            openssl \
            ccache \
            pkg-config \
            2>&1 || echo "Conda install had issues, continuing..."

          echo "=== Building flex from source ==="
          cd /tmp
          if ! command -v flex &> /dev/null; then
            curl -fsSL https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz -o flex.tar.gz
            tar -xzf flex.tar.gz
            cd flex-2.6.4
            ./configure --prefix=$HOME/.local
            make -j$(nproc)
            make install
            cd /tmp && rm -rf flex-2.6.4 flex.tar.gz
          fi

          echo "=== Building bison from source ==="
          cd /tmp
          if ! command -v bison &> /dev/null; then
            curl -fsSL https://ftp.gnu.org/gnu/bison/bison-3.8.tar.gz -o bison.tar.gz
            tar -xzf bison.tar.gz
            cd bison-3.8
            ./configure --prefix=$HOME/.local
            make -j$(nproc)
            make install
            cd /tmp && rm -rf bison-3.8 bison.tar.gz
          fi

          export PATH="$HOME/.local/bin:$CONDA_ROOT/bin:$PATH"

          echo "=== Verifying installations ==="
          which flex bison python rsync ccache || echo "Some tools not found in PATH"
          flex --version
          bison --version

          # Set USE_CCACHE
          export USE_CCACHE=0
          if command -v ccache &> /dev/null; then
            export USE_CCACHE=1
            echo "ccache available: $(ccache --version)"
          fi

          echo "Build dependency check complete. USE_CCACHE=$USE_CCACHE"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-arm64-spx-${{ matrix.variant.name }}-${{ github.sha }}
          restore-keys: |
            ccache-arm64-spx-${{ matrix.variant.name }}-

      - name: Setup ccache
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$CONDA_ROOT/bin:$PATH"
          export CONDA_ROOT=$HOME/miniforge
          source "$CONDA_ROOT/etc/profile.d/conda.sh" 2>/dev/null || true
          conda activate base 2>/dev/null || true

          if command -v ccache &> /dev/null; then
            ccache -M 50G
            ccache -z
          else
            echo "ccache not available, skipping setup"
          fi

      - name: Configure kernel (${{ matrix.variant.name }})
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$CONDA_ROOT/bin:$PATH"
          export CONDA_ROOT=$HOME/miniforge
          source "$CONDA_ROOT/etc/profile.d/conda.sh" 2>/dev/null || true
          conda activate base 2>/dev/null || true

          BUILD_DIR="${KERNEL_BUILD_DIR}-${{ matrix.variant.name }}"
          SPX_FRAG="$KERNEL_SRC_DIR/arch/arm64/configs/surface_pro_x.config"
          IS_BUILTIN="${{ matrix.variant.extra_fragment }}"

          # Regenerate the config when any relevant fragment is newer than
          # the existing .config, or when no .config exists yet.
          NEED_REGEN=0
          if [ ! -f "$BUILD_DIR/.config" ]; then
            NEED_REGEN=1
          elif [ "$KERNEL_SRC_DIR/Makefile" -nt "$BUILD_DIR/.config" ]; then
            NEED_REGEN=1
          elif [ "$SPX_FRAG" -nt "$BUILD_DIR/.config" ]; then
            NEED_REGEN=1
          fi

          if [ "$NEED_REGEN" = "1" ]; then
            echo "=== Generating config for variant: ${{ matrix.variant.name }} ==="

            # Step 1: generate the base generic arm64 defconfig
            make -C $KERNEL_SRC_DIR O="$BUILD_DIR" ARCH=arm64 defconfig

            # Step 2: merge the Surface Pro X hardware-specific fragment
            KCONFIG_CONFIG="$BUILD_DIR/.config" \
              $KERNEL_SRC_DIR/scripts/kconfig/merge_config.sh \
              -m -O "$BUILD_DIR" \
              "$BUILD_DIR/.config" \
              "$SPX_FRAG"

            # Step 3 (built-in variant only): convert every =m to =y so
            # the kernel image is fully self-contained (no initramfs needed).
            # A static fragment cannot achieve this because olddefconfig
            # demotes =y back to =m whenever a parent framework dependency
            # (DRM, CFG80211, SND, BT, TYPEC, …) is still =m.
            if [ -n "$IS_BUILTIN" ]; then
              echo "=== Converting all =m to =y for built-in variant ==="
              sed -i 's/=m$/=y/' "$BUILD_DIR/.config"
            fi

            # Step 4: resolve any new symbols introduced by the merge(s)
            make -C $KERNEL_SRC_DIR O="$BUILD_DIR" ARCH=arm64 olddefconfig
          else
            echo "=== Config up-to-date for variant: ${{ matrix.variant.name }}, skipping regeneration ==="
          fi

      - name: Build kernel (${{ matrix.variant.name }})
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$CONDA_ROOT/bin:$PATH"
          export CONDA_ROOT=$HOME/miniforge
          export CCACHE_DIR=$CCACHE_DIR
          source "$CONDA_ROOT/etc/profile.d/conda.sh" 2>/dev/null || true
          conda activate base 2>/dev/null || true

          BUILD_DIR="${KERNEL_BUILD_DIR}-${{ matrix.variant.name }}"

          # The built-in variant does not need to build loadable modules
          MAKE_TARGETS="Image.gz dtbs"
          if [ "${{ matrix.variant.name }}" = "modular" ]; then
            MAKE_TARGETS="Image.gz modules dtbs"
          fi

          if [ "${USE_CCACHE:-0}" = "1" ]; then
            echo "Building with ccache..."
            make -C $KERNEL_SRC_DIR O="$BUILD_DIR" ARCH=arm64 CC="ccache gcc" -j$(nproc) $MAKE_TARGETS
          else
            echo "Building without ccache..."
            make -C $KERNEL_SRC_DIR O="$BUILD_DIR" ARCH=arm64 -j$(nproc) $MAKE_TARGETS
          fi

      - name: Package artifacts (${{ matrix.variant.name }})
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$CONDA_ROOT/bin:$PATH"
          export CONDA_ROOT=$HOME/miniforge
          source "$CONDA_ROOT/etc/profile.d/conda.sh" 2>/dev/null || true
          conda activate base 2>/dev/null || true

          BUILD_DIR="${KERNEL_BUILD_DIR}-${{ matrix.variant.name }}"
          ARTIFACT_DIR="${KERNEL_ARTIFACTS_DIR}-${{ matrix.variant.name }}"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          cp "$BUILD_DIR/arch/arm64/boot/Image.gz" "$ARTIFACT_DIR/" || echo "Image.gz not found"
          cp "$BUILD_DIR/arch/arm64/boot/dts/qcom/sc8180x-surface-pro-x.dtb" "$ARTIFACT_DIR/" || {
            echo "DTB not found, listing available DTBs:"
            ls -la "$BUILD_DIR/arch/arm64/boot/dts/qcom/" 2>/dev/null || \
              ls -la "$BUILD_DIR/arch/arm64/boot/dts/" 2>/dev/null
            exit 1
          }
          cp "$BUILD_DIR/.config" "$ARTIFACT_DIR/config.log"

          if [ "${{ matrix.variant.name }}" = "modular" ]; then
            make -C $KERNEL_SRC_DIR O="$BUILD_DIR" ARCH=arm64 \
              INSTALL_MOD_PATH="$BUILD_DIR/modules_install" modules_install
            tar -czf "$ARTIFACT_DIR/modules.tar.gz" -C "$BUILD_DIR/modules_install" .
          fi

          {
            echo "Variant: ${{ matrix.variant.name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            if command -v ccache &> /dev/null; then
              echo "=== Ccache Statistics ==="
              ccache -s
            fi
          } > "$ARTIFACT_DIR/build-info.txt"

          # Keep the build directory for the next run so Kbuild can reuse
          # existing objects and perform true incremental rebuilds.
          # Only the temporary modules_install tree is disposable.
          rm -rf "$BUILD_DIR/modules_install"

  archlinux-package:
    needs: build
    runs-on: [self-hosted, arm64]
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h / /home/runner
          echo "--- Cleaning up ---"
          # Keep the persistent build dirs so the next workflow run can
          # incrementally rebuild instead of starting from scratch.
          # Remove only temporary modules_install trees (can be multi-GB each).
          rm -rf ${KERNEL_BUILD_DIR}-modular/modules_install \
                 ${KERNEL_BUILD_DIR}-builtin/modules_install
          # Remove old artifact dirs from previous runs
          rm -rf ${KERNEL_ARTIFACTS_DIR}-archlinux
          # Remove GitHub Actions workspace temp artifacts
          rm -rf /home/runner/_work/linux-surface/linux-surface/artifacts-*
          rm -rf /home/runner/_work/linux-surface/linux-surface/release-*
          echo "--- After cleanup ---"
          df -h / /home/runner

      - name: Build Arch Linux package
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$CONDA_ROOT/bin:$PATH"
          export CONDA_ROOT=$HOME/miniforge
          source "$CONDA_ROOT/etc/profile.d/conda.sh" 2>/dev/null || true
          conda activate base 2>/dev/null || true

          if command -v docker &>/dev/null; then
            CONTAINER_RUNTIME=docker
          elif command -v podman &>/dev/null; then
            CONTAINER_RUNTIME=podman
          else
            echo "ERROR: neither docker nor podman is available on the runner"
            exit 1
          fi

          PKG_WORKDIR="${KERNEL_ARTIFACTS_DIR}-archlinux-build"
          rm -rf "${PKG_WORKDIR}" "${KERNEL_ARTIFACTS_DIR}-archlinux"
          mkdir -p "${PKG_WORKDIR}" "${KERNEL_ARTIFACTS_DIR}-archlinux"

          cp packaging/archlinux/PKGBUILD "${PKG_WORKDIR}/"
          cp packaging/archlinux/linux-denys.preset "${PKG_WORKDIR}/"
          cp packaging/archlinux/linux-denys.conf "${PKG_WORKDIR}/"
          cp packaging/archlinux/linux-denys.install "${PKG_WORKDIR}/"

          sed -i "s|@COMMIT@|${GITHUB_SHA}|g" "${PKG_WORKDIR}/PKGBUILD"

          ${CONTAINER_RUNTIME} run --rm \
            -e PACKAGER="CI <github-actions@github.com>" \
            -v "${PKG_WORKDIR}:/work" \
            -w /work \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm --needed git dtc xmlto inetutils bc kmod
              useradd -m builder
              chown -R builder:builder /work
              su builder -c "cd /work && makepkg -f --noconfirm"
            '

          cp "${PKG_WORKDIR}"/*.pkg.tar.zst "${KERNEL_ARTIFACTS_DIR}-archlinux"/

      - name: Verify Arch Linux package
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$CONDA_ROOT/bin:$PATH"
          export CONDA_ROOT=$HOME/miniforge
          source "$CONDA_ROOT/etc/profile.d/conda.sh" 2>/dev/null || true
          conda activate base 2>/dev/null || true

          # Find the package file (there should be exactly one)
          PKG_FILE="$(ls "${KERNEL_ARTIFACTS_DIR}-archlinux/"*.pkg.tar.zst 2>/dev/null | head -1)"

          if [[ -z "${PKG_FILE}" ]]; then
            echo "ERROR: No .pkg.tar.zst file found in ${KERNEL_ARTIFACTS_DIR}-archlinux/"
            exit 1
          fi

          echo "==> Verifying package: ${PKG_FILE}"
          echo "==> File size: $(du -sh "${PKG_FILE}")"

          # Use bsdtar to list contents (bsdtar understands zstd and reports errors properly)
          if ! command -v bsdtar &>/dev/null; then
            echo "  [warn] bsdtar not found, installing via conda..."
            conda install -y bsdtar 2>/dev/null || true
          fi

          if command -v bsdtar &>/dev/null; then
            echo "==> Listing package contents with bsdtar..."
            bsdtar -tf "${PKG_FILE}" | head -30

            echo ""
            echo "==> Checking that .PKGINFO is the FIRST entry (required by pacman)..."
            FIRST_ENTRY="$(bsdtar -tf "${PKG_FILE}" | head -1)"
            echo "  First entry: ${FIRST_ENTRY}"
            if [[ "${FIRST_ENTRY}" != ".PKGINFO" && "${FIRST_ENTRY}" != "./.PKGINFO" ]]; then
              echo "  WARNING: .PKGINFO is not the first entry! pacman may reject this package."
            fi

            echo ""
            echo "==> Checking for required metadata files..."
            if bsdtar -tf "${PKG_FILE}" | grep -q '\.PKGINFO'; then
              echo "  .PKGINFO: FOUND"
            else
              echo "  .PKGINFO: MISSING!"
              exit 1
            fi

            if bsdtar -tf "${PKG_FILE}" | grep -q '\.MTREE'; then
              echo "  .MTREE: FOUND"
            else
              echo "  .MTREE: MISSING!"
              exit 1
            fi

            if bsdtar -tf "${PKG_FILE}" | grep -q '\.INSTALL'; then
              echo "  .INSTALL: FOUND"
            else
              echo "  .INSTALL: MISSING!"
              exit 1
            fi

            echo ""
            echo "==> Dumping .PKGINFO content..."
            bsdtar -xf "${PKG_FILE}" -O .PKGINFO 2>/dev/null || \
              bsdtar -xf "${PKG_FILE}" -O ./.PKGINFO 2>/dev/null

            echo ""
            echo "==> Checking for broken symlinks (build/source)..."
            if bsdtar -tf "${PKG_FILE}" | grep -qE '(^|\./)usr/lib/modules/[^/]+/(build|source)$'; then
              echo "  WARNING: build or source symlinks found in modules directory!"
              bsdtar -tf "${PKG_FILE}" | grep -E '(^|\./)usr/lib/modules/[^/]+/(build|source)$'
            else
              echo "  No build/source symlinks: OK"
            fi

            echo ""
            echo "==> Checking for mkinitcpio preset..."
            if bsdtar -tf "${PKG_FILE}" | grep -qE '(^|\./)etc/mkinitcpio\.d/linux-denys\.preset$'; then
              echo "  preset: FOUND"
            else
              echo "  preset: MISSING!"
              echo "  The mkinitcpio preset is required for initramfs generation."
              exit 1
            fi

            echo ""
            echo "==> Checking for kernel image and pkgbase..."
            if bsdtar -tf "${PKG_FILE}" | grep -qE '(^|\./)usr/lib/modules/[^/]+/vmlinuz$'; then
              echo "  vmlinuz: FOUND"
            else
              echo "  vmlinuz: MISSING!"
              exit 1
            fi
            if bsdtar -tf "${PKG_FILE}" | grep -qE '(^|\./)usr/lib/modules/[^/]+/pkgbase$'; then
              echo "  pkgbase: FOUND"
            else
              echo "  pkgbase: MISSING!"
              exit 1
            fi

            echo ""
            echo "==> Checking that the package does not own /lib..."
            if bsdtar -tf "${PKG_FILE}" | grep -qE '^(\\./)?lib(/|$)'; then
              echo "  /lib ownership detected!"
              bsdtar -tf "${PKG_FILE}" | grep -E '^(\\./)?lib(/|$)'
              exit 1
            else
              echo "  No /lib entries: OK"
            fi

            echo ""
            echo "==> Package verification passed!"
          else
            echo "  [warn] bsdtar not available, skipping verification"
          fi

  release:
    needs: [build, archlinux-package]
    runs-on: [self-hosted, arm64]
    if: success()
    steps:
      - name: Prepare release directories
        run: |
          rm -rf release-modular release-builtin release-archlinux
          mkdir -p release-modular release-builtin release-archlinux

          # Copy from persistent local paths (same runner, no download needed)
          cp "${KERNEL_ARTIFACTS_DIR}-modular"/* release-modular/
          cp "${KERNEL_ARTIFACTS_DIR}-builtin"/* release-builtin/
          cp "${KERNEL_ARTIFACTS_DIR}-archlinux"/*.pkg.tar.zst release-archlinux/

          # Prefix filenames so both variants can coexist in a single release
          for f in release-modular/*; do
            mv "$f" "release-modular/modular-$(basename "$f")"
          done
          for f in release-builtin/*; do
            mv "$f" "release-builtin/builtin-$(basename "$f")"
          done

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spx-build-${{ github.sha }}
          name: Surface Pro X Kernel - ${{ github.ref_name }} - ${{ github.sha }}
          prerelease: true
          files: |
            release-modular/*
            release-builtin/*
            release-archlinux/*
          body: |
            Automated kernel build for Surface Pro X (SC8180X/SQ2)

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## Build Variants

            ### Modular (`modular-*`)
            Standard kernel with SPX drivers as loadable modules (`=m`).
            Suitable for distribution-style installs with an initramfs.
            - `modular-Image.gz` - Compressed kernel image
            - `modular-sc8180x-surface-pro-x.dtb` - Device tree blob
            - `modular-modules.tar.gz` - Kernel modules (extract to rootfs)
            - `modular-config.log` - Kernel configuration
            - `modular-build-info.txt` - Build metadata

            ### Built-in (`builtin-*`)
            Every `=m` converted to `=y` — all drivers compiled into the kernel image.
            **No initramfs required** — flash Image.gz + DTB and boot directly.
            - `builtin-Image.gz` - Compressed kernel image (self-contained)
            - `builtin-sc8180x-surface-pro-x.dtb` - Device tree blob
            - `builtin-config.log` - Kernel configuration
            - `builtin-build-info.txt` - Build metadata

            ### Arch Linux Package (`linux-denys-*.pkg.tar.zst`)
            Ready-to-install Arch Linux ARM package built with `makepkg`.
            Install with: `sudo pacman -U linux-denys-*.pkg.tar.zst`
            Includes kernel image, modules, DTBs, and mkinitcpio preset.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases (keep last 2)
        run: |
          if ! command -v gh &> /dev/null; then
            echo "ERROR: gh CLI not installed"
            exit 1
          fi
          gh release list --limit 100 --json tagName,name | \
            jq -r '.[] | select(.tagName | startswith("spx-build-")) | .tagName' | \
            tail -n +3 | \
            while read tag; do
              gh release delete "$tag" --yes
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free artifact disk space
        if: always()
        run: |
          rm -rf "${KERNEL_ARTIFACTS_DIR}-modular" \
                 "${KERNEL_ARTIFACTS_DIR}-builtin" \
                 "${KERNEL_ARTIFACTS_DIR}-archlinux" \
                 release-modular release-builtin release-archlinux
