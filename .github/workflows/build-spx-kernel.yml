name: Build Surface Pro X (SC8180X) Kernel

on:
  push:
    branches:
      - 'spx/**'
  workflow_dispatch:

# Cancel previous runs of the same workflow to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/runner/.cache/ccache
  KERNEL_SRC_DIR: /home/runner/kernel-builds/linux-surface-src
  KERNEL_BUILD_DIR: /home/runner/kernel-builds/linux-surface-build
  # Use GitHub's cache for Nix binary cache
  NIX_GC_ROOT: /home/runner/.nix-gc

jobs:
  build:
    runs-on: [self-hosted, arm64]
    steps:
      - name: Setup environment
        run: |
          export HOME=/home/runner
          mkdir -p $KERNEL_SRC_DIR
          mkdir -p $KERNEL_BUILD_DIR
          mkdir -p $CCACHE_DIR
          mkdir -p $HOME/.nix-state/daemon-socket
          echo "Source directory: $KERNEL_SRC_DIR"
          echo "Build directory: $KERNEL_BUILD_DIR"
          echo "Ccache directory: $CCACHE_DIR"
          echo "HOME: $HOME"

      - name: Checkout to persistent location (zero-bandwidth incremental)
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
          REF="${{ github.ref_name }}"
          SHA="${{ github.sha }}"

          if [ -d "$KERNEL_SRC_DIR/.git" ]; then
            echo "Repository exists, fetching updates..."
            cd "$KERNEL_SRC_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch origin
            git checkout -f "$SHA"
            git reset --hard "$SHA"
            # Only clean source files, not build artifacts in KERNEL_BUILD_DIR
            git clean -fdx --exclude=modules_install
            echo "Checked out commit: $(git log -1 --oneline)"
          else
            echo "Cloning repository (first time)..."
            git clone --depth=1 --branch="$REF" "$REPO_URL" "$KERNEL_SRC_DIR"
            cd "$KERNEL_SRC_DIR"
            git fetch origin "$SHA"
            git checkout -f "$SHA"
            echo "Checked out commit: $(git log -1 --oneline)"
          fi

      - name: Install Nix (single-user, no daemon)
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$PATH"

          # Set up Nix environment to use $HOME instead of /nix
          export NIX_CONF_DIR=$HOME/.config/nix
          export NIX_LOCALSTATE_DIR=$HOME/.local/state/nix
          export NIX_LOG_DIR=$HOME/.local/log/nix
          export NIX_CACHE_DIR=/home/runner/.cache/nix
          export NIX_GC_ROOT=$HOME/.nix-gc
          export NIX_STORE_DIR=$HOME/.store
          export NIX_IGNORE_SYMLINK_STORE=1

          mkdir -p $NIX_CONF_DIR $NIX_LOCALSTATE_DIR $NIX_LOG_DIR $NIX_CACHE_DIR $NIX_GC_ROOT $HOME/.store

          echo "=== Installing Nix ==="

          # Download Nix binary release
          if ! command -v nix &> /dev/null; then
            echo "Downloading Nix..."
            curl -fL https://releases.nixos.org/nix/nix-2.24.10/nix-2.24.10-aarch64-linux.tar.xz -o /tmp/nix.tar.xz

            echo "Extracting to $HOME..."
            tar -xJf /tmp/nix.tar.xz -C $HOME

            # Find and link nix binaries
            NIX_BIN=$(find $HOME -name "nix" -type f -executable 2>/dev/null | head -1)
            if [ -n "$NIX_BIN" ] && [ -x "$NIX_BIN" ]; then
              echo "Found nix at: $NIX_BIN"
              # Copy to local bin
              mkdir -p $HOME/.local/bin
              cp "$NIX_BIN" $HOME/.local/bin/nix
              chmod +x $HOME/.local/bin/nix
              # Also copy nix-env, nix-daemon, etc if they exist
              NIX_DIR=$(dirname "$NIX_BIN")
              for bin in nix-env nix-daemon nix-store; do
                if [ -x "$NIX_DIR/$bin" ]; then
                  cp "$NIX_DIR/$bin" $HOME/.local/bin/$bin
                fi
              done
            else
              echo "Could not find nix binary in extracted files"
              ls -la $HOME/
              find $HOME -name "nix" -type f 2>/dev/null | head -5
              exit 1
            fi
            rm -f /tmp/nix.tar.xz
          fi

          echo "Nix version: $(nix --version)"
          echo "Nix installed successfully"

      - name: Install build dependencies with Nix
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$PATH"

          # Set up Nix environment
          export NIX_CONF_DIR=$HOME/.config/nix
          export NIX_LOCALSTATE_DIR=$HOME/.local/state/nix
          export NIX_LOG_DIR=$HOME/.local/log/nix
          export NIX_CACHE_DIR=/home/runner/.cache/nix
          export NIX_GC_ROOT=$HOME/.nix-gc
          export NIX_STORE_DIR=$HOME/.store
          export NIX_IGNORE_SYMLINK_STORE=1
          export NIX_PATH=nixpkgs=channel:nixpkgs-unstable

          mkdir -p $NIX_CONF_DIR $NIX_LOCALSTATE_DIR $NIX_LOG_DIR $NIX_CACHE_DIR $NIX_GC_ROOT $HOME/.store

          # Create nix.conf
          cat > $NIX_CONF_DIR/nix.conf <<'NIXCONF'
substituters = https://cache.nixos.org https://nix-community.cachix.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
builders =
NIXCONF

          echo "=== Installing build dependencies via Nix ==="

          # Install packages using nix-env
          nix-env -iA nixpkgs.flex nixpkgs.bison nixpkgs.elfutils nixpkgs.openssl nixpkgs.python3 nixpkgs.rsync nixpkgs.ccache nixpkgs.u-bootTools nixpkgs.dwarves -f https://github.com/NixOS/nixpkgs/tarball/nixos-24.11 2>&1 || echo "Nix install had issues, continuing..."

          echo "=== Verifying installations ==="
          which flex bison python3 rsync ccache mkimage dwarves || echo "Some tools not found in PATH"

          # Set USE_CCACHE
          export USE_CCACHE=0
          if command -v ccache &> /dev/null; then
            export USE_CCACHE=1
            echo "ccache available: $(ccache --version)"
          fi

          echo "Build dependency check complete. USE_CCACHE=$USE_CCACHE"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-arm64-spx-${{ github.sha }}
          restore-keys: |
            ccache-arm64-spx-

      - name: Setup ccache
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$PATH"
          export NIX_CONF_DIR=$HOME/.config/nix
          export NIX_STORE_DIR=$HOME/.store

          if command -v ccache &> /dev/null; then
            ccache -M 50G
            ccache -z
          else
            echo "ccache not available, skipping setup"
          fi

      - name: Configure kernel
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$HOME/.store/*/bin:$PATH"
          export NIX_CONF_DIR=$HOME/.config/nix
          export NIX_STORE_DIR=$HOME/.store

          # Only reconfigure if .config doesn't exist or makefile changed
          if [ ! -f $KERNEL_BUILD_DIR/.config ] || [ $KERNEL_SRC_DIR/Makefile -nt $KERNEL_BUILD_DIR/.config ]; then
            make -C $KERNEL_SRC_DIR O=$KERNEL_BUILD_DIR ARCH=arm64 defconfig
          fi

      - name: Build kernel
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$HOME/.store/*/bin:$PATH"
          export NIX_CONF_DIR=$HOME/.config/nix
          export NIX_STORE_DIR=$HOME/.store
          export CCACHE_DIR=$CCACHE_DIR

          if [ "${USE_CCACHE:-0}" = "1" ]; then
            echo "Building with ccache..."
            make -C $KERNEL_SRC_DIR O=$KERNEL_BUILD_DIR ARCH=arm64 CC="ccache gcc" -j$(nproc) Image.gz modules
          else
            echo "Building without ccache..."
            make -C $KERNEL_SRC_DIR O=$KERNEL_BUILD_DIR ARCH=arm64 -j$(nproc) Image.gz modules
          fi

      - name: Package artifacts
        run: |
          export HOME=/home/runner
          export PATH="$HOME/.local/bin:$HOME/.store/*/bin:$PATH"
          export NIX_CONF_DIR=$HOME/.config/nix
          export NIX_STORE_DIR=$HOME/.store

          mkdir -p artifacts

          # Copy kernel image
          cp $KERNEL_BUILD_DIR/arch/arm64/boot/Image.gz artifacts/ || echo "Image.gz not found"

          # Copy device tree blob
          cp $KERNEL_BUILD_DIR/arch/arm64/boot/dts/qcom/sc8180x-surface-pro-x.dtb artifacts/ 2>/dev/null || echo "DTB not found"

          # Copy config
          cp $KERNEL_BUILD_DIR/.config artifacts/config.log

          # Package modules to build dir (not source dir)
          make -C $KERNEL_SRC_DIR O=$KERNEL_BUILD_DIR ARCH=arm64 INSTALL_MOD_PATH=$KERNEL_BUILD_DIR/modules_install modules_install
          tar -czf artifacts/modules.tar.gz -C $KERNEL_BUILD_DIR/modules_install .

          # Create build info
          {
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo ""
            if command -v ccache &> /dev/null; then
              echo "=== Ccache Statistics ==="
              ccache -s
            else
              echo "=== Ccache: not available ==="
            fi
          } > artifacts/build-info.txt

      - name: Upload to GitHub artifacts
        uses: actions/upload-artifact@v7
        with:
          name: surface-pro-x-kernel-${{ github.sha }}
          path: artifacts/
          retention-days: 7

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spx-build-${{ github.sha }}
          name: Surface Pro X Kernel - ${{ github.ref_name }} - ${{ github.sha }}
          prerelease: true
          files: artifacts/*
          body: |
            Automated kernel build for Surface Pro X (SC8180X/SQ2)

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## Build Artifacts
            - `Image.gz` - Compressed kernel image
            - `sc8180x-surface-pro-x.dtb` - Device tree blob
            - `modules.tar.gz` - Kernel modules
            - `config.log` - Kernel configuration
            - `build-info.txt` - Build metadata and ccache stats

            ## Installation
            ```bash
            # Download artifacts from the Assets section below

            # Install kernel image
            sudo cp Image.gz /boot/vmlinuz-linux-spx

            # Install modules
            sudo tar -xzf modules.tar.gz -C /

            # Update initramfs (adjust for your distro)
            sudo update-initramfs -c -k linux-spx  # Debian/Ubuntu
            # or
            sudo mkinitcpio -p linux-spx  # Arch
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases (keep last 5)
        if: success()
        run: |
          # gh CLI should be pre-installed on runner; fail fast if missing
          if ! command -v gh &> /dev/null; then
            echo "ERROR: gh CLI not installed on runner. Please install it via runner-setup.sh"
            exit 1
          fi

          # Delete old pre-releases, keep last 5
          gh release list --limit 100 | grep "spx-build-" | tail -n +6 | awk '{print $3}' | while read tag; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
