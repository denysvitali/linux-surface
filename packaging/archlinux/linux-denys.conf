# mkinitcpio config for the linux-denys package
#
# Preserve the user's normal mkinitcpio settings, then add the Surface Pro X
# modules required for early boot (display, keyboard, USB).

source /etc/mkinitcpio.conf

_spx_modules=(
  # Display: keep internal panel alive during EFI/simpledrm -> MSM eDP handoff
  msm
  panel-edp
  phy-qcom-edp
  pwm_bl

  # USB: DWC3 controller + PHYs for USB keyboards / peripherals
  dwc3
  dwc3_qcom
  phy-qcom-qmp-combo
  phy-qcom-qmp-usb
  usbhid

  # SAM: Surface Aggregator Module for Type Cover keyboard
  surface_aggregator
  surface_aggregator_registry
  surface_aggregator_hub
  surface_hid

  # SPI HID (touchscreen / alternative keyboard path)
  spi-hid
)

for _mod in "${_spx_modules[@]}"; do
  case " ${MODULES[*]} " in
    *" ${_mod} "*) ;;
    *) MODULES+=("${_mod}") ;;
  esac
done

unset _mod
unset _spx_modules
