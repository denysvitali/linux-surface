# mkinitcpio config for the linux-denys package
#
# Preserve the user's normal mkinitcpio settings, then add the Surface Pro X
# modules required for early boot (display, keyboard, USB).
#
# Reference: https://github.com/linux-surface/surface-pro-x/wiki/Basic-Setup#initram

source /etc/mkinitcpio.conf

_spx_modules=(
  # Display: keep internal panel alive during EFI/simpledrm -> MSM eDP handoff
  msm
  panel-edp
  phy-qcom-edp
  pwm_bl

  # USB: DWC3 controller + PHYs for USB keyboards / peripherals
  # Note: phy-qcom-qmp-combo, phy-qcom-qmp-usb, usb-storage, and uas are built-in (=y)
  dwc3
  dwc3-qcom
  phy-qcom-snps-femto-v2
  usbhid

  # Type-C / UCSI: the SPX USB-C ports depend on the PMIC GLINK transport to
  # establish role, orientation, and DP Alt Mode state. If these stay modular
  # but out of the initramfs, USB devices can remain invisible until very late
  # userspace or never enumerate cleanly after the rootfs handoff.
  typec
  roles
  typec_ucsi
  ucsi_glink
  pmic_glink
  pmic_glink_altmode
  typec_displayport

  # WLAN: load the SNOC path early so the radio can come up without waiting
  # for the real root to be mounted.
  ath10k_core
  ath10k_snoc

  # Note: the following are built-in (=y) and don't need initramfs loading:
  #   SAM: surface_aggregator, surface_aggregator_registry, surface_aggregator_hub,
  #        surface_hid_core, surface_hid
  #   SPI: spi-qcom-geni, spi-hid (Type Cover keyboard path on SPX)
)

for _mod in "${_spx_modules[@]}"; do
  case " ${MODULES[*]} " in
    *" ${_mod} "*) ;;
    *) MODULES+=("${_mod}") ;;
  esac
done

# Pull in the firmware blobs that the MSM and ath10k drivers request before
# the real rootfs is available. Missing these in the initramfs leaves the panel
# dark until late userspace and can prevent the WLAN core from probing early.
_spx_files=(
  /usr/lib/firmware/qcom/a680_gmu.bin
  /usr/lib/firmware/qcom/a680_sqe.fw
  /usr/lib/firmware/qcom/msft/surface/pro-x-sq2/qcdxkmsuc8180.mbn
  /usr/lib/firmware/qcom/msft/surface/pro-x-sq2/qcmpss8180.mbn
  /usr/lib/firmware/ath10k/WCN3990/hw1.0/board-2.bin
  /usr/lib/firmware/ath10k/WCN3990/hw1.0/firmware-5.bin
)

for _file in "${_spx_files[@]}"; do
  [ -e "${_file}" ] || continue

  case " ${FILES[*]} " in
    *" ${_file} "*) ;;
    *) FILES+=("${_file}") ;;
  esac
done

# Prefer the KMS hook when available so mkinitcpio loads the DRM stack during
# early boot instead of waiting for late userspace.
case " ${HOOKS[*]} " in
  *" kms "*) ;;
  *)
    _new_hooks=()
    _kms_added=0

    for _hook in "${HOOKS[@]}"; do
      if [ "${_kms_added}" -eq 0 ] && [ "${_hook}" = "udev" ]; then
        _new_hooks+=("udev" "kms")
        _kms_added=1
      else
        _new_hooks+=("${_hook}")
      fi
    done

    if [ "${_kms_added}" -eq 0 ]; then
      _new_hooks=("kms" "${_new_hooks[@]}")
    fi

    HOOKS=("${_new_hooks[@]}")
    unset _new_hooks _kms_added
    ;;
esac

unset _file
unset _hook
unset _mod
unset _spx_files
unset _spx_modules
