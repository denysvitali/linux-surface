# mkinitcpio config for the linux-denys package
#
# Preserve the user's normal mkinitcpio settings, then add the Surface Pro X
# early-display modules required to keep the internal panel alive during the
# EFI/simpledrm -> Qualcomm MSM eDP handoff.

source /etc/mkinitcpio.conf

_spx_display_modules=(
  msm
  panel-edp
  phy-qcom-edp
  pwm_bl
)

for _mod in "${_spx_display_modules[@]}"; do
  case " ${MODULES[*]} " in
    *" ${_mod} "*) ;;
    *) MODULES+=("${_mod}") ;;
  esac
done

unset _mod
unset _spx_display_modules
