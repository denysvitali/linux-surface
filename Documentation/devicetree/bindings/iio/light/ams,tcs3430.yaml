%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/ams,tcs3430.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMS TCS3430 XYZ Color and Ambient Light Sensor

maintainers:
  - linux-surface contributors <linux-surface@groups.io>

description: |
  The AMS TCS3430 is a 4-channel color sensor providing CIE XYZ tristimulus
  values and an infrared channel. It communicates via I2C at a fixed address
  of 0x39 and supports configurable integration time and analog gain.

  Datasheet: https://ams.com/tcs3430

properties:
  compatible:
    const: ams,tcs3430

  reg:
    description: I2C address of the sensor. The TCS3430 has a fixed address.
    const: 0x39

  interrupts:
    description:
      Interrupt specifier for the ALS threshold interrupt (active-low,
      level-triggered).
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        color-sensor@39 {
            compatible = "ams,tcs3430";
            reg = <0x39>;
            interrupt-parent = <&tlmm>;
            interrupts = <24 IRQ_TYPE_LEVEL_LOW>;
        };
    };
...
