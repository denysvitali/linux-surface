%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/ams,tcs3430.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMS TCS3430 color and ambient light sensor

maintainers:
  - Denys Vitali <denys@denv.it>

description: |
  I2C color sensor with CIE XYZ and infrared channels. The device has no
  proximity or gesture engine.

properties:
  compatible:
    const: ams,tcs3430

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@39 {
            compatible = "ams,tcs3430";
            reg = <0x39>;
            interrupt-parent = <&gpio>;
            interrupts = <24 IRQ_TYPE_LEVEL_LOW>;
        };
    };
